<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GOD'S EYE — Authorized Tracking</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
*{box-sizing:border-box}body{margin:0;background:#050606;color:#e8fff4;font-family:Arial,sans-serif}
header{height:68px;background:#0a0e0d;border-bottom:1px solid #1b352b;display:flex;align-items:center;justify-content:space-between;padding:0 24px}
.logo{font-weight:800;letter-spacing:3px}.green{color:#00ff88}.status{font-size:12px;color:#00ff88}
main{display:grid;grid-template-columns:1fr 340px;height:calc(100vh - 68px)}
#map{height:100%;background:#101010}
aside{background:#080c0b;border-left:1px solid #1b352b;padding:18px;overflow:auto}
h2{font-size:14px;letter-spacing:2px;color:#00ff88;margin:0 0 14px}
input,button{width:100%;padding:12px;border-radius:5px;border:1px solid #244b3a;background:#0d1713;color:#fff;margin-bottom:10px}
button{background:#00ff88;color:#00170b;font-weight:bold;cursor:pointer}
button.stop{background:#ff5555;color:white}
.notice{font-size:11px;color:#8aa398;line-height:1.5;padding:10px;border:1px solid #20372d;margin-bottom:14px}
.device{border:1px solid #20372d;padding:12px;margin:8px 0;background:#0b1210;border-radius:5px}
.device b{display:block;margin-bottom:5px}.muted{color:#789087;font-size:11px}
#log{font-size:11px;color:#9db3a8}.logline{border-bottom:1px solid #17251f;padding:7px 0}
@media(max-width:850px){main{grid-template-columns:1fr;height:auto}#map{height:55vh}aside{border-left:0;border-top:1px solid #1b352b}}
</style>
</head>
<body>
<header>
  <div class="logo"><span class="green">◉</span> GOD'S EYE</div>
  <div class="status">● AUTHORIZED NETWORK</div>
</header>
<main>
  <div id="map"></div>
  <aside>
    <h2>DEVICE TRACKER</h2>
    <div class="notice">
      Location sharing is opt-in. A device appears here only after its user
      grants browser location permission and presses START SHARING.
    </div>
    <input id="name" maxlength="50" placeholder="Your device name">
    <button id="start">START SHARING MY LOCATION</button>
    <button id="stop" class="stop">STOP SHARING</button>

    <h2 style="margin-top:18px">AUTHORIZED DEVICES</h2>
    <div id="devices"></div>

    <h2 style="margin-top:18px">EVENT LOG</h2>
    <div id="log"></div>
  </aside>
</main>

<script src="/socket.io/socket.io.js"></script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const socket = io();
const map = L.map("map").setView([9.08, 7.40], 6);

L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
  maxZoom: 19,
  attribution: "&copy; OpenStreetMap contributors"
}).addTo(map);

const markers = new Map();
const log = document.getElementById("log");
const devices = document.getElementById("devices");
const nameInput = document.getElementById("name");

function addLog(message) {
  const row = document.createElement("div");
  row.className = "logline";
  row.textContent = new Date().toLocaleTimeString() + " — " + message;
  log.prepend(row);
}

function renderDevices(list) {
  devices.innerHTML = "";
  for (const d of list) {
    const box = document.createElement("div");
    box.className = "device";
    box.innerHTML =
      "<b>" + escapeHtml(d.name) + "</b>" +
      '<div class="muted">Consent: ACTIVE</div>' +
      '<div class="muted">Coordinates: ' +
      (d.lat === null ? "waiting for GPS" :
       d.lat.toFixed(6) + ", " + d.lng.toFixed(6)) +
      "</div>" +
      '<div class="muted">Accuracy: ' +
      (d.accuracy ? Math.round(d.accuracy) + " m" : "—") +
      "</div>";
    devices.appendChild(box);
  }
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({
    "&":"&amp;","<":"&lt;",">":"&gt;",
    '"':"&quot;","'":"&#039;"
  }[c]));
}

socket.on("devices", renderDevices);

socket.on("location", d => {
  const point = [d.lat, d.lng];
  let marker = markers.get(d.id);

  if (!marker) {
    marker = L.marker(point).addTo(map);
    markers.set(d.id, marker);
  } else {
    marker.setLatLng(point);
  }

  marker.bindPopup(
    "<b>" + escapeHtml(d.name) + "</b><br>" +
    "Consent: ACTIVE<br>" +
    "Accuracy: " + (d.accuracy ? Math.round(d.accuracy) + " m" : "—")
  );

  addLog("GPS update received from " + d.name);
});

document.getElementById("start").onclick = () => {
  if (!navigator.geolocation) {
    alert("This browser does not support GPS location.");
    return;
  }

  const name = nameInput.value.trim() || "Authorized Device";

  navigator.geolocation.getCurrentPosition(
    position => {
      socket.emit("register", { name });
      sendLocation(position);
      addLog("Location sharing started by " + name);
      watchId = navigator.geolocation.watchPosition(sendLocation, locationError, {
        enableHighAccuracy: true,
        maximumAge: 5000,
        timeout: 15000
      });
    },
    locationError,
    { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 }
  );
};

let watchId = null;

function sendLocation(position) {
  socket.emit("location", {
    lat: position.coords.latitude,
    lng: position.coords.longitude,
    accuracy: position.coords.accuracy
  });
}

function locationError(error) {
  const messages = {
    1: "Location permission was denied.",
    2: "Location is unavailable.",
    3: "Location request timed out."
  };
  alert(messages[error.code] || "Could not obtain location.");
}

document.getElementById("stop").onclick = () => {
  if (watchId !== null) {
    navigator.geolocation.clearWatch(watchId);
    watchId = null;
  }
  socket.emit("stopSharing");
  addLog("Location sharing stopped.");
};

addLog("Dashboard connected.");
</script>
</body>
</html>
